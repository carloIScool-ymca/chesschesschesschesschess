<!DOCTYPE html>
<html>
<head>
    <title>Stockfish 1v1</title>
    <!-- CSS for the board -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #myBoard { width: 400px; margin: 20px; }
        .info { margin: 10px; padding: 10px; background: #f0f0f0; border-radius: 5px; width: 400px; }
    </style>
</head>
<body>
    <h2>Stockfish 1v1</h2>
    <div id="myBoard"></div>
    
    <div class="info">
        <label>Elo Strength: <span id="eloLabel">1500</span></label><br>
        <input type="range" id="eloSlider" min="1350" max="2850" value="1500" step="50">
        <hr>
        <div><strong>Eval:</strong> <span id="status">0.00</span></div>
        <div><strong>Why:</strong> <span id="enginePV">Thinking...</span></div>
    </div>

    <!-- Required Libraries -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var stockfish = new Worker('stockfish.js'); // This must be in the same folder

        // Initialize Engine
        stockfish.postMessage('uci');
        setElo(1500);

        function setElo(value) {
            stockfish.postMessage('setoption name UCI_LimitStrength value true');
            stockfish.postMessage('setoption name UCI_Elo value ' + value);
        }

        // Engine Listener
        stockfish.onmessage = function(event) {
            var line = event.data;
            if (line.includes('score cp')) {
                var score = (line.match(/score cp (-?\d+)/)[1] / 100).toFixed(2);
                document.getElementById('status').innerText = score;
            }
            if (line.includes(' pv ')) {
                document.getElementById('enginePV').innerText = line.split(' pv ')[1].split(' ').slice(0, 4).join(' ');
            }
            if (line.startsWith('bestmove')) {
                var move = line.split(' ')[1];
                game.move(move, { sloppy: true });
                board.position(game.fen());
            }
        };

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            stockfish.postMessage('position fen ' + game.fen());
            stockfish.postMessage('go depth 12');
        }

        board = Chessboard('myBoard', { draggable: true, position: 'start', onDrop: onDrop });
        
        document.getElementById('eloSlider').oninput = function() {
            document.getElementById('eloLabel').innerText = this.value;
            setElo(this.value);
        };
    </script>
</body>
</html>
